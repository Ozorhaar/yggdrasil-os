---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Everything Yggdrasil adds on top of Bazzite. Shared by both GPU variants.
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - papirus-icon-theme
        - google-noto-sans-runic-fonts
        - plymouth-plugin-script   # the boot splash is a Plymouth script theme
        - qt6-qtwebengine          # the living fjord wallpaper runs its scene in a web view

  - type: script
    scripts:
      - yggdrasil-build.sh

  # Apps installed on the booted system (system-wide, from Flathub). Checked at
  # every boot and skipped when nothing changed; remove an app here and it stays
  # installed until you uninstall it yourself.
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.jellyfin.JellyfinDesktop   # official Jellyfin client (the old Jellyfin Media Player)

  - type: signing
