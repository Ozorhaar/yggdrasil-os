; Yggdrasil runic clock (Yggdrasil Systems, personal use)
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Yggdrasil Clock
Author=Yggdrasil Systems
Information=Time and date carved in Yggdrasil Runic on an iron plate.
Version=1.0
License=Personal use

@Include=#@#Variables.inc

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A  %#d %B

[MeterFrame]
Meter=Image
ImageName=#@#frame-clock.png
X=0
Y=0

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=280
Y=22
StringAlign=Center
FontFace=#Font#
FontSize=66
FontColor=#GoldHi#
StringEffect=Shadow
FontEffectColor=0,0,0,170
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=280
Y=132
StringAlign=Center
FontFace=#Font#
FontSize=18
FontColor=#Bone#
AntiAlias=1
