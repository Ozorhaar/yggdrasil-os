; Yggdrasil system meters: CPU, GPU, RAM and network (Yggdrasil Systems, personal use)
; Uses only Rainmeter's built-in measures and its bundled UsageMonitor plugin.
[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Yggdrasil Meters
Author=Yggdrasil Systems
Information=Forge (CPU), Fire (GPU), Mind (RAM) and Bifrost (network) on an iron plate.
Version=1.0
License=Personal use

@Include=#@#Variables.inc

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureGPU]
; total 3D engine load across GPUs (Windows' GPU performance counters)
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0
MinValue=0
MaxValue=100

[MeasureRAM]
Measure=PhysicalMemory

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

[MeterFrame]
Meter=Image
ImageName=#@#frame-meters.png
X=0
Y=0

; ---------------------------------------------------------------- shared styles
[StyleLabel]
X=28
FontFace=#Font#
FontSize=15
FontColor=#Gold#
AntiAlias=1

[StyleBar]
X=130
W=340
H=16
BarColor=#Gold#,235
SolidColor=#Iron#,255
BarOrientation=Horizontal

[StyleNotch]
X=130
ImageName=#@#notches.png

[StyleValue]
X=532
StringAlign=Right
FontFace=#Font#
FontSize=13
FontColor=#Bone#
AntiAlias=1
NumOfDecimals=0

; ---------------------------------------------------------------- forge (CPU)
[LabelCPU]
Meter=String
MeterStyle=StyleLabel
Y=30
Text=Forge
[BarCPU]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureCPU
Y=36
[NotchCPU]
Meter=Image
MeterStyle=StyleNotch
Y=36
[ValueCPU]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPU
Y=33
Text=%1%

; ---------------------------------------------------------------- fire (GPU)
[LabelGPU]
Meter=String
MeterStyle=StyleLabel
Y=76
Text=Fire
[BarGPU]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureGPU
BarColor=#Ember#,235
Y=82
[NotchGPU]
Meter=Image
MeterStyle=StyleNotch
Y=82
[ValueGPU]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureGPU
Y=79
Text=%1%

; ---------------------------------------------------------------- mind (RAM)
[LabelRAM]
Meter=String
MeterStyle=StyleLabel
Y=122
Text=Mind
[BarRAM]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureRAM
BarColor=#Frost#,235
Y=128
[NotchRAM]
Meter=Image
MeterStyle=StyleNotch
Y=128
[ValueRAM]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAM
Percentual=1
Y=125
Text=%1%

; ---------------------------------------------------------------- bifrost (network)
[LabelNet]
Meter=String
MeterStyle=StyleLabel
Y=170
Text=Bifrost
[ValueNet]
Meter=String
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
X=532
Y=172
StringAlign=Right
FontFace=#Font#
FontSize=13
FontColor=#Bone#
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text=down %1B/s   up %2B/s
[GraphNet]
Meter=Line
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
LineCount=2
LineColor=#Frost#,230
LineColor2=#Ember#,230
LineWidth=2
AutoScale=1
AntiAlias=1
HorizontalLineColor=#Gold#,40
HorizontalLines=1
X=28
Y=206
W=504
H=96
SolidColor=0,0,0,60
